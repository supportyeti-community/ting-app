name: TING-10 current password fix

on:
  push:
    branches: [ting10-password-lifecycle]
    paths: [.github/workflows/ting10-fix-current-password.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ting10-password-lifecycle
          fetch-depth: 0
      - name: Fix current password option
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          old = "const { error } = await supabaseInstance.auth.updateUser({ password, current_password: currentPassword });"
          new = "const { error } = await supabaseInstance.auth.updateUser({ password, currentPassword });"
          if old not in s:
              raise SystemExit('expected current_password call not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "TING-10: enforce current password verification"
          git push origin HEAD:ting10-password-lifecycle
