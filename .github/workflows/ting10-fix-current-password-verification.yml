name: TING-10 current password verification fix

on:
  push:
    branches: [ting10-password-lifecycle]
    paths: [.github/workflows/ting10-fix-current-password-verification.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ting10-password-lifecycle
          fetch-depth: 0
      - name: Patch authenticated current-password verification
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('admin.html')
          s = admin.read_text()
          old = """        const { error } = await supabaseInstance.auth.updateUser({ password, currentPassword });
        if (error) { message.style.color=varColor('--danger'); message.innerText=error.message; return; }
"""
          new = """        const { data:userResult, error:userError } = await supabaseInstance.auth.getUser();
        const currentEmail = userResult?.user?.email || null;
        if (userError || !currentEmail) {
            message.style.color=varColor('--danger');
            message.innerText='Unable to verify your current account. Sign in again and retry.';
            return;
        }

        const { error:credentialError } = await supabaseInstance.auth.signInWithPassword({
            email: currentEmail,
            password: currentPassword
        });
        if (credentialError) {
            message.style.color=varColor('--danger');
            message.innerText='Current password is incorrect.';
            return;
        }

        const { error } = await supabaseInstance.auth.updateUser({ password });
        if (error) { message.style.color=varColor('--danger'); message.innerText=error.message; return; }
"""
          if old not in s:
              raise SystemExit('expected authenticated password update block not found')
          admin.write_text(s.replace(old, new, 1))

          test = Path('tests/ting10-password-lifecycle.mjs')
          t = test.read_text()
          old_test = "mustContain(admin, 'currentPassword: currentPassword', 'current-password verification');"
          if old_test not in t:
              raise SystemExit('expected current-password regression assertion not found')
          new_test = """mustContain(admin, 'auth.signInWithPassword({', 'explicit current-password credential verification');
mustContain(admin, 'password: currentPassword', 'current password supplied to credential verification');
mustContain(admin, \"message.innerText='Current password is incorrect.'\", 'wrong current password rejection');
mustContain(admin, 'auth.updateUser({ password })', 'authenticated password update after verification');
mustNotContain(admin, 'current_password: currentPassword', 'legacy snake_case current password option');"""
          test.write_text(t.replace(old_test, new_test, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html tests/ting10-password-lifecycle.mjs
          git commit -m "TING-10: verify current password before account update"
          git push origin HEAD:ting10-password-lifecycle
