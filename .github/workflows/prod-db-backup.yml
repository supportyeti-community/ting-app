name: TinG production database encrypted backup and restore certification
on:
  schedule:
    - cron: '17 16 * * *' # 02:47 ACDT, 01:47 ACST
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prod-db-backup.yml'
      - 'scripts/prod-db-backup/**'
permissions:
  contents: read
concurrency:
  group: ting-prod-db-backup
  cancel-in-progress: false
jobs:
  backup-restore:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == 'supportyeti-community/ting-app' && github.head_ref == 'ops/prod-db-backup') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      EXPECTED_PROJECT_REF: okrwklulwrfnrhnffbwp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned Supabase 2.117.0
        run: npm ci --prefix supabase/baseline/native
      - name: Test read-only capture boundaries (no artifacts until certified)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD"
          cli="$GITHUB_WORKSPACE/supabase/baseline/native/node_modules/.bin/supabase"
          test "$("$cli" --version)" = 2.117.0
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          "$cli" init --yes --workdir "$tmp"
          "$cli" link --project-ref "$EXPECTED_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --workdir "$tmp"
          export PGOPTIONS='-c default_transaction_read_only=on'
          "$cli" db dump --linked --role-only --file "$tmp/roles.sql" --workdir "$tmp"
          "$cli" db dump --linked --file "$tmp/schema.sql" --workdir "$tmp"
          "$cli" db dump --linked --data-only --use-copy --schema public,auth,supabase_migrations --file "$tmp/data.sql" --workdir "$tmp"
          for f in roles.sql schema.sql data.sql; do test -s "$tmp/$f"; done
          for table in public.tenants public.menu_items public.orders public.menu_allergen_codes public.menu_item_allergen_reviews auth.users supabase_migrations.schema_migrations; do
            if grep -Eq "^COPY ${table//./\\.} " "$tmp/data.sql"; then
              echo "DUMP_COPY_PRESENT=$table"
            else
              echo "DUMP_COPY_MISSING=$table"
              exit 1
            fi
          done
          echo 'Read-only multi-schema data capture includes Auth and the 29-version ledger'
