name: TING-10 recovery session read fix

on:
  push:
    branches: [ting10-password-lifecycle]
    paths: [.github/workflows/ting10-fix-recovery-session-read.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ting10-password-lifecycle
          fetch-depth: 0
      - name: Patch reset recovery session read
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reset-password.html')
          s = p.read_text()
          old = """      const { data:initData, error:initError } = await supabaseInstance.auth.initialize();
      if (initError) {
        console.error('Recovery initialization failed:', initError);
        return failClosed('This recovery link is invalid or expired. Request a new password reset.');
      }

      const initializedSession = initData?.session || null;
"""
          new = """      const { error:initError } = await supabaseInstance.auth.initialize();
      if (initError) {
        console.error('Recovery initialization failed:', initError);
        return failClosed('This recovery link is invalid or expired. Request a new password reset.');
      }

      const { data:sessionData, error:sessionError } = await supabaseInstance.auth.getSession();
      if (sessionError) {
        console.error('Recovery session read failed:', sessionError);
        return failClosed('This recovery link is invalid or expired. Request a new password reset.');
      }

      const initializedSession = sessionData?.session || null;
"""
          if old not in s:
              raise SystemExit('expected block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reset-password.html
          git commit -m "TING-10: read recovery session after initialization"
          git push origin HEAD:ting10-password-lifecycle
