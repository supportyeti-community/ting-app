name: TING-11C one-time admin wiring

on:
  push:
    branches: [ting11c-order-board]
    paths:
      - '.github/workflows/ting11c-wire-admin.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ting11c-order-board
          fetch-depth: 0
      - name: Insert board script without normalizing admin.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin.html')
          data = path.read_bytes()
          include = b'<script src="ting11c-order-board.js"></script>'
          if include in data:
              raise SystemExit(0)
          marker = b'</body>'
          if marker not in data:
              raise SystemExit('admin.html missing </body> marker')
          insertion = b'<script src="ting11c-order-board.js"></script>\n'
          path.write_bytes(data.replace(marker, insertion + marker, 1))
          PY
          git diff --check
      - name: Commit wiring and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/ting11c-wire-admin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html .github/workflows/ting11c-wire-admin.yml
          git commit -m 'TING-11C: wire restaurant order board into admin'
          git push origin HEAD:ting11c-order-board
