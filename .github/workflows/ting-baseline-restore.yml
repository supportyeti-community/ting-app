name: TinG native baseline restore
on:
  pull_request:
    paths:
      - 'supabase/baseline/**'
      - '.github/workflows/ting-baseline-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ting-restore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned verification dependencies
        run: npm ci --prefix supabase/baseline/native
      - name: Restore into disposable Supabase and verify services
        run: node supabase/baseline/native/run.mjs
      - name: Publish sanitized result in job summary
        if: always()
        shell: bash
        run: |
          if test -f supabase/baseline/native/result.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat supabase/baseline/native/result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
