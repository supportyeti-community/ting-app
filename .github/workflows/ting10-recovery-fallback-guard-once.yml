name: TING-10 recovery fallback guard once
on:
  push:
    branches: [ting10-password-lifecycle]
    paths: ['.github/workflows/ting10-recovery-fallback-guard-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ting10-password-lifecycle
          persist-credentials: true
      - name: Patch recovery fallback guard and tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          old = """    const URL_ROUTING_PARAMS = new URLSearchParams(window.location.search);\n    const clientSlug = URL_ROUTING_PARAMS.get('client')?.trim() || null;\n\n    let adminChannel = null;"""
          new = """    const URL_ROUTING_PARAMS = new URLSearchParams(window.location.search);\n    const clientSlug = URL_ROUTING_PARAMS.get('client')?.trim() || null;\n\n    function redirectRecoveryAwayFromAdmin() {\n        const fragment = new URLSearchParams(window.location.hash.replace(/^#/, ''));\n        if (fragment.get('type') !== 'recovery') return false;\n\n        const recoveryUrl = new URL('/reset-password.html', window.location.origin);\n        if (clientSlug) recoveryUrl.searchParams.set('client', clientSlug);\n        recoveryUrl.hash = window.location.hash;\n        window.location.replace(recoveryUrl.toString());\n        return true;\n    }\n\n    if (redirectRecoveryAwayFromAdmin()) {\n        throw new Error('Recovery flow redirected away from admin workspace.');\n    }\n\n    let adminChannel = null;"""
          if old not in s:
              raise SystemExit('admin routing anchor not found')
          s = s.replace(old, new, 1)
          old2 = """            supabaseInstance = supabase.createClient(config.supabase_url, config.supabase_anon_key, {\n                global: { headers: { 'x-client-slug': clientSlug } }\n            });"""
          new2 = """            supabaseInstance = supabase.createClient(config.supabase_url, config.supabase_anon_key, {\n                global: { headers: { 'x-client-slug': clientSlug } },\n                auth: { detectSessionInUrl: false }\n            });"""
          if old2 not in s:
              raise SystemExit('tenant client anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          t = Path('tests/ting10-password-lifecycle.mjs')
          ts = t.read_text()
          anchor = "mustContain(admin, \"recoveryUrl.searchParams.set('client', clientSlug)\", 'tenant route preservation');\n"
          addition = """mustContain(admin, \"fragment.get('type') !== 'recovery'\", 'admin recovery-fragment guard');\nmustContain(admin, \"window.location.replace(recoveryUrl.toString())\", 'admin recovery redirect');\nmustContain(admin, \"auth: { detectSessionInUrl: false }\", 'admin refuses auth URL session consumption');\n"""
          if anchor not in ts:
              raise SystemExit('test anchor not found')
          ts = ts.replace(anchor, anchor + addition, 1)
          t.write_text(ts)
      - name: Remove this one-shot workflow
        run: rm .github/workflows/ting10-recovery-fallback-guard-once.yml
      - name: Commit patch
        run: |
          git config user.name "supportyeti-community"
          git config user.email "supportyeti.community@gmail.com"
          git add admin.html tests/ting10-password-lifecycle.mjs .github/workflows/ting10-recovery-fallback-guard-once.yml
          git commit -m "TING-10: block recovery sessions from admin workspace"
          git push origin HEAD:ting10-password-lifecycle