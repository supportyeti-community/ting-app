name: FS-01A plus FS-01B disposable native import
on:
  push:
    branches: ['fs-01b-bulk-menu-import'] # non-production head verification when GitHub PR checks lag
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - 'supabase/migrations/20261116000000_fs01a_menu_category_allergen_contract.sql'
      - 'supabase/migrations/20261117000000_fs01b_bulk_menu_draft_import.sql'
      - 'supabase/baseline/native/fs01a.mjs'
      - 'supabase/baseline/native/fs01b.mjs'
      - 'supabase/baseline/native/fs01b-browser.mjs'
      - 'fs01b-guest-allergy.js'
      - 'ting11b-cart.js'
      - 'supabase/baseline/native/run-fs01b.mjs'
      - 'admin.html'
      - 'index.html'
      - 'fs01b-menu-import.js'
      - 'fs01b-allergen-review.js'
      - 'fs01b-category-editor.js'
      - '.github/workflows/fs01b-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fs01b-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  disposable-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TING_TEST_ISSUE: fs01b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # previous main application artifact for restoration rehearsal
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Report production credential names present without inspecting values
        env:
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
          HAS_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID != '' || vars.SUPABASE_PROJECT_ID != '' }}
        run: |
          for key in HAS_SUPABASE_ACCESS_TOKEN HAS_SUPABASE_DB_PASSWORD HAS_DATABASE_URL HAS_SUPABASE_DB_URL HAS_SUPABASE_PROJECT_ID; do
            echo "${key}=${!key}"
          done
          echo 'Credential presence only; the disposable runner never receives credential values.'
        shell: bash
      - name: Verify Vercel deployment-source exclusions and runtime allowlist
        shell: bash
        run: |
          set -euo pipefail
          for directory in supabase tests docs .github scripts; do
            grep -Fxq "$directory" .vercelignore
          done
          grep -Fxq '*.sql' .vercelignore
          for asset in index.html admin.html fs01b-menu-import.js fs01b-allergen-review.js fs01b-category-editor.js fs01b-guest-allergy.js ting11b-cart.js; do
            test -s "$asset"
            if grep -Fxq "$asset" .vercelignore; then echo "Runtime asset ignored: $asset"; exit 1; fi
          done
          echo 'Vercel static source exclusion contract PASS; deployment URL probes remain a post-build gate.'
      - name: Syntax-check browser import and native harness
        run: |
          node --check fs01b-menu-import.js
          node --check fs01b-allergen-review.js
          node --check fs01b-category-editor.js
          node --check fs01b-guest-allergy.js
          node --check ting11b-cart.js
          node --check supabase/baseline/native/fs01b-browser.mjs
          node --check supabase/baseline/native/fs01b.mjs
          node --check supabase/baseline/native/run-fs01b.mjs
      - name: Install pinned disposable harness
        run: npm ci --prefix supabase/baseline/native
      - name: Install pinned browser E2E dependencies (disposable)
        run: |
          npm install --no-save --ignore-scripts --prefix supabase/baseline/native playwright@1.65.1 papaparse@5.7.1 read-excel-file@9.3.14 exceljs@4.4.0
          supabase/baseline/native/node_modules/.bin/playwright install --with-deps chromium
      - name: Execute native FS-01A + FS-01B rehearsal
        run: node supabase/baseline/native/run-fs01b.mjs
      - name: Sanitized execution report
        if: always()
        run: |
          if test -f supabase/baseline/native/result.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat supabase/baseline/native/result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  founder-production-readonly-preflight:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 51 && github.event.pull_request.head.repo.full_name == 'supportyeti-community/ting-app' && github.head_ref == 'fs-01a-menu-allergen-contract' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      EXPECTED_PROJECT_REF: okrwklulwrfnrhnffbwp
    steps:
      - name: Checkout exact candidate commit; never persist GitHub token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned Supabase CLI
        run: npm ci --prefix supabase/baseline/native
      - name: Linked production ledger and dry-run ONLY (no production writes)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          CLI="$GITHUB_WORKSPACE/supabase/baseline/native/node_modules/.bin/supabase"
          test "$("$CLI" --version)" = '2.117.0'
          "$CLI" link --project-ref "$EXPECTED_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo 'Linked production migration ledger (read-only)'
          "$CLI" migration list --linked 2>&1 | tee "$RUNNER_TEMP/fs01-production-list.txt"
          echo 'Production db push --dry-run --linked only'
          "$CLI" db push --dry-run --linked 2>&1 | tee "$RUNNER_TEMP/fs01-production-dryrun.txt"
          grep -q '20261116000000' "$RUNNER_TEMP/fs01-production-dryrun.txt"
          grep -q '20261117000000' "$RUNNER_TEMP/fs01-production-dryrun.txt"
          echo 'Both expected migrations present in dry-run; manual exact-only reconciliation required before any write.'
          echo 'PRODUCTION_PREFLIGHT_COMMANDS_COMPLETED=true' >> "$GITHUB_STEP_SUMMARY"
