name: TING-11B runtime hardening once
on:
  push:
    branches:
      - ting11b-customer-cart
    paths:
      - '.github/workflows/ting11b-runtime-hardening-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ting11b-customer-cart
          fetch-depth: 0
      - name: Isolate cart initialization from the existing customer page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ting11b-cart.js')
          source = path.read_text()
          old = """    function init() {\n        injectStyles();\n        injectCartUi();\n        startMenuObserver();\n        renderCartState();\n    }\n\n    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });\n    else init();\n})();\n"""
          new = """    function init() {\n        try {\n            injectStyles();\n            injectCartUi();\n            startMenuObserver();\n            renderCartState();\n            window.ting11bCartReady = true;\n        } catch (error) {\n            window.ting11bCartReady = false;\n            console.error('TING-11B cart initialization failed safely:', error);\n        }\n    }\n\n    if (document.readyState === 'complete') init();\n    else window.addEventListener('load', init, { once: true });\n})();\n"""
          if old not in source:
              raise SystemExit('Expected TING-11B init block not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Remove one-time hardening workflow
        run: rm .github/workflows/ting11b-runtime-hardening-once.yml
      - name: Commit runtime hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ting11b-cart.js .github/workflows/ting11b-runtime-hardening-once.yml
          git diff --cached --check
          git commit -m "TING-11B: isolate cart runtime from customer shell"
          git push origin HEAD:ting11b-customer-cart
