name: TING-10 password lifecycle
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'reset-password.html'
      - 'tests/ting10-password-lifecycle.mjs'
      - '.github/workflows/ting10-password-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ting10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  password-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node tests/ting10-password-lifecycle.mjs
