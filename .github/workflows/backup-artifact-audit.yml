name: Temporary backup artifact/readiness audit (read-only)
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ['.github/workflows/backup-artifact-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect-encrypted-backups:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query own GitHub Actions status and encrypted artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          base="https://api.github.com/repos/supportyeti-community/ting-app"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25))
          runs=get(base+"/actions/workflows/prod-db-backup.yml/runs?per_page=20").get("workflow_runs",[])
          print("LATEST_BACKUP_WORKFLOW_RUNS="+str(len(runs)))
          for r in runs[:10]:
              print("BACKUP_RUN id="+str(r["id"])+" event="+r["event"]+" status="+r["status"]+" conclusion="+str(r["conclusion"])+" sha="+r["head_sha"][:12])
          dispatches=[r for r in runs if r["event"]=="workflow_dispatch"]
          if not dispatches:
              print("BACKUP_DISPATCH_STATUS=NOT_FOUND")
          else:
              d=dispatches[0]
              print("LATEST_BACKUP_DISPATCH_ID="+str(d["id"]))
              print("LATEST_BACKUP_DISPATCH_STATUS="+str(d["status"]))
              print("LATEST_BACKUP_DISPATCH_CONCLUSION="+str(d["conclusion"]))
              arts=get(base+"/actions/runs/"+str(d["id"])+"/artifacts").get("artifacts",[])
              for a in arts:
                  print("BACKUP_ARTIFACT name="+a["name"]+" size_bytes="+str(a["size_in_bytes"])+" expired="+str(a["expired"])+" id="+str(a["id"]))
              if d["status"]=="completed" and d["conclusion"]=="success":
                  valid=[a for a in arts if a["name"].startswith("ting-production-db-encrypted-") and a["size_in_bytes"]>0 and not a["expired"]]
                  if len(valid)!=1: raise RuntimeError("Successful backup run without exactly one unexpired encrypted artifact")
                  print("ENCRYPTED_PRODUCTION_ARTIFACT=VERIFIED")
          PY
