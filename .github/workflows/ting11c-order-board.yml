name: TING-11C order board

on:
  pull_request:
    paths:
      - 'admin.html'
      - 'ting11c-order-board.js'
      - 'tests/ting11c/**'
      - '.github/workflows/ting11c-order-board.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Order board bundle syntax
        run: node --check ting11c-order-board.js
      - name: Restaurant order board contracts
        run: node tests/ting11c/order-board-contract.mjs
