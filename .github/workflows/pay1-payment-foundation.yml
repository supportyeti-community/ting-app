name: PAY-1 payment foundation

on:
  pull_request:
    paths:
      - 'docs/PAYMENTS-V1-DESIGN.md'
      - 'supabase/migrations/20261008110500_pay1_payment_foundation.sql'
      - 'tests/pay1/**'
      - '.github/workflows/pay1-payment-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-foundation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Payment foundation contract
        run: node tests/pay1/payment-foundation-contract.mjs
