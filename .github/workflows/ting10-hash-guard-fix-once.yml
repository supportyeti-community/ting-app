name: TING-10 hash guard fix once
on:
  push:
    branches: [ting10-password-lifecycle]
    paths: ['.github/workflows/ting10-hash-guard-fix-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ting10-password-lifecycle
          persist-credentials: true
      - name: Harden missing hash handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          old = "const fragment = new URLSearchParams(window.location.hash.replace(/^#/, ''));"
          new = "const fragment = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));"
          if old not in s:
              raise SystemExit('hash guard anchor not found')
          p.write_text(s.replace(old, new, 1))
      - name: Remove this one-shot workflow
        run: rm .github/workflows/ting10-hash-guard-fix-once.yml
      - name: Commit patch
        run: |
          git config user.name "supportyeti-community"
          git config user.email "supportyeti.community@gmail.com"
          git add admin.html .github/workflows/ting10-hash-guard-fix-once.yml
          git commit -m "TING-10: tolerate missing location hash in admin guard"
          git push origin HEAD:ting10-password-lifecycle