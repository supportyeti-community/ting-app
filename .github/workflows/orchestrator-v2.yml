name: TinG orchestrator v2 prototype tests
on:
  pull_request:
    paths:
      - 'tools/orchestrator-v2/**'
      - '.github/workflows/orchestrator-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claim-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Unit test fail-closed task-selection and claim protocol
        run: node --test tools/orchestrator-v2/core.test.mjs
