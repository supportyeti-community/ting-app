name: TING-11B fix observer once
on:
  push:
    branches:
      - ting11b-customer-cart
    paths:
      - '.github/workflows/ting11b-fix-observer-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ting11b-customer-cart
          fetch-depth: 0
      - name: Remove recursive subtree observation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ting11b-cart.js')
          source = path.read_text()
          old = "observer.observe(wrapper, { childList: true, subtree: true });"
          new = "observer.observe(wrapper, { childList: true });"
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one recursive observer registration')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/ting11b-fix-observer-once.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ting11b-cart.js .github/workflows/ting11b-fix-observer-once.yml
          git diff --cached --check
          git commit -m "TING-11B: stop recursive cart observer loop"
          git push origin HEAD:ting11b-customer-cart
