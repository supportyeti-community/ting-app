name: PAY-2 current-main recovery

on:
  pull_request:
    paths:
      - 'api/payments/**'
      - 'lib/payments-server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/migrations/*pay2*'
      - 'supabase/baseline/native/pay1.mjs'
      - 'supabase/baseline/native/pay2.mjs'
      - 'supabase/baseline/native/run.mjs'
      - 'tests/pay2/**'
      - '.github/workflows/pay2-current-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pay2-current-main-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check payment server files
        run: |
          node --check lib/payments-server.js
          node --check api/payments/create-intent.js
          node --check api/payments/stripe-webhook.js
          node --check supabase/baseline/native/pay2.mjs
      - name: Run PAY-2 hardened contract
        run: node tests/pay2/current-main-contract.mjs
      - name: Generate candidate root lockfile from pinned direct dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
          printf 'PAY2_ROOT_LOCK_B64='
          base64 -w0 package-lock.json
          printf '\n'

  pay2-native-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/baseline/native/package-lock.json
      - name: Install pinned native verification dependencies
        working-directory: supabase/baseline/native
        run: npm ci
      - name: Run PAY-2 disposable Supabase rehearsal
        working-directory: supabase/baseline/native
        env:
          TING_TEST_ISSUE: pay2
        run: npm test
