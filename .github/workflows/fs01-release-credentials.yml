name: Founder FS-01 release credential availability (no secret values)
on:
  push:
    branches: ['fs-01a-menu-allergen-contract']
    paths: ['.github/workflows/fs01-release-credentials.yml']
permissions:
  contents: read
jobs:
  detect-credential-names:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
      HAS_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID != '' || vars.SUPABASE_PROJECT_ID != '' }}
    steps:
      - name: Report only boolean credential availability
        shell: bash
        run: |
          for key in HAS_SUPABASE_ACCESS_TOKEN HAS_SUPABASE_DB_PASSWORD HAS_DATABASE_URL HAS_SUPABASE_DB_URL HAS_SUPABASE_PROJECT_ID; do
            echo "${key}=${!key}"
          done
          echo "Credential availability probe only; no credential values or network calls."
