<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset TinG Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script>
  <style>
    :root { --dark-bg:#0b1329; --card-bg:#1c2541; --accent:#e67e22; --danger:#ef4444; --success:#10b981; --border:#334155; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--dark-bg); color:#f8fafc; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { width:min(400px,calc(100vw - 48px)); padding:32px; background:var(--card-bg); border:1px solid var(--border); border-radius:16px; box-shadow:0 20px 25px -5px rgba(0,0,0,.4); }
    h1 { margin:0 0 8px; font-size:24px; text-align:center; }
    p { color:#94a3b8; font-size:13px; text-align:center; line-height:1.5; }
    form { display:none; flex-direction:column; gap:16px; margin-top:24px; }
    label { display:block; margin-bottom:6px; font-size:12px; font-weight:700; color:#cbd5e1; text-transform:uppercase; }
    input { width:100%; box-sizing:border-box; padding:12px; background:var(--dark-bg); border:1px solid var(--border); color:white; border-radius:8px; }
    button { padding:14px; border:0; border-radius:8px; background:var(--accent); color:white; font-weight:700; cursor:pointer; }
    #message { margin-top:14px; font-size:13px; font-weight:600; text-align:center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Set a new password</h1>
    <p id="status">Validating your password recovery link…</p>
    <form id="resetForm">
      <div><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <div><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <button type="submit">Set new password</button>
    </form>
    <div id="message"></div>
  </main>
<script>
  const MASTER_URL = "https://okrwklulwrfnrhnffbwp.supabase.co";
  const MASTER_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rcndrbHVsd3JmbnJobmZmYndwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjUyNzAsImV4cCI6MjA5NzE0MTI3MH0.hyXSxopMDh3nfcrVicgQxkTDKb11ChA8UDBb9h2tMVk";
  const clientSlug = new URLSearchParams(window.location.search).get('client')?.trim() || null;
  let supabaseInstance = null;
  let recoveryAuthorized = false;
  const recoveryFragment = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  const recoveryType = recoveryFragment.get('type');
  const recoveryAccessToken = recoveryFragment.get('access_token');

  bootRecovery();

  async function bootRecovery() {
    if (!clientSlug) return failClosed('This recovery link is incomplete. Request a new password reset from your restaurant admin login.');

    try {
      const master = supabase.createClient(MASTER_URL, MASTER_KEY, { global:{ headers:{ 'x-client-slug':clientSlug } } });
      const { data:config, error:configError } = await master.from('restaurant_clients').select('supabase_url, supabase_anon_key').eq('client_slug',clientSlug).single();
      if (configError || !config) return failClosed('This recovery link is invalid. Request a new password reset.');

      // Recovery redirects can be consumed immediately during client construction.
      // Pause auto-initialization so the PASSWORD_RECOVERY listener is attached
      // before Supabase processes the URL and emits the recovery event.
      supabaseInstance = supabase.createClient(config.supabase_url, config.supabase_anon_key, {
        auth:{ skipAutoInitialize:true },
        global:{ headers:{ 'x-client-slug':clientSlug } }
      });

      // Capture recovery evidence before initialize() consumes the URL fragment.
      // A normal authenticated session is insufficient: the fragment must be a
      // recovery redirect with an access token, and the initialized Supabase
      // session must contain that exact same token.
      const { data:initData, error:initError } = await supabaseInstance.auth.initialize();
      if (initError) {
        console.error('Recovery initialization failed:', initError);
        return failClosed('This recovery link is invalid or expired. Request a new password reset.');
      }

      const initializedSession = initData?.session || null;
      const hasVerifiedRecoveryProof =
        recoveryType === 'recovery' &&
        Boolean(recoveryAccessToken) &&
        Boolean(initializedSession?.access_token) &&
        initializedSession.access_token === recoveryAccessToken;

      if (!hasVerifiedRecoveryProof) {
        return failClosed('This recovery link is invalid or expired. Request a new password reset.');
      }

      authorizeRecovery();
    } catch (error) {
      console.error('Recovery boot failed:', error);
      failClosed('Password recovery is unavailable. Request a new password reset and try again.');
    }
  }

  function authorizeRecovery() {
    if (recoveryAuthorized) return;
    recoveryAuthorized = true;
    document.getElementById('status').textContent = 'Choose a new password for your account.';
    document.getElementById('resetForm').style.display = 'flex';
  }

  function failClosed(message) {
    recoveryAuthorized = false;
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('status').textContent = message;
  }

  document.getElementById('resetForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = document.getElementById('message');
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!recoveryAuthorized || !supabaseInstance) return failClosed('Recovery authorization is no longer valid. Request a new password reset.');
    if (password.length < 8) { message.style.color='var(--danger)'; message.textContent='Use at least 8 characters.'; return; }
    if (password !== confirm) { message.style.color='var(--danger)'; message.textContent='Passwords do not match.'; return; }

    const { error } = await supabaseInstance.auth.updateUser({ password });
    if (error) { message.style.color='var(--danger)'; message.textContent=error.message; return; }

    recoveryAuthorized = false;
    document.getElementById('resetForm').style.display='none';
    message.style.color='var(--success)';
    message.textContent='Password updated. Returning to your restaurant admin login…';
    await supabaseInstance.auth.signOut();
    setTimeout(() => { window.location.href='/admin.html?client='+encodeURIComponent(clientSlug); }, 1200);
  });
</script>
</body>
</html>
