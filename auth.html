<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinG Account Access</title>
  <style>
    :root { --dark-bg:#0b1329; --card-bg:#1c2541; --accent:#e67e22; --border:#334155; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--dark-bg); color:#f8fafc; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { width:min(440px,calc(100vw - 48px)); padding:32px; background:var(--card-bg); border:1px solid var(--border); border-radius:16px; text-align:center; box-shadow:0 20px 25px -5px rgba(0,0,0,.4); }
    h1 { margin:0 0 10px; font-size:24px; }
    p { margin:0; color:#94a3b8; line-height:1.55; }
    a { display:inline-block; margin-top:20px; color:white; background:var(--accent); text-decoration:none; font-weight:700; padding:11px 16px; border-radius:8px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Account link needs a fresh start</h1>
    <p>This authentication link cannot open a restaurant workspace directly. Return to your restaurant admin sign-in page and request a new password reset.</p>
    <a href="/">Return to TinG</a>
  </main>
</body>
</html>
